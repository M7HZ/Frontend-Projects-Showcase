<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Athenaeum Library | Academic Catalog System — UNITAR Project</title>
  <meta name="description" content="Academic library catalog system with real-time search, category filters, availability filters, and borrow/return state management. University project." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-cream: #faf9f6;
      --bg-white: #ffffff;
      --text-dark: #2c3e50;
      --text-light: #7f8c8d;
      --primary: #1b4332;
      --primary-hover: #122e22;
      --accent: #c6a87c;
      --border: #e2dfd2;
      --font-heading: 'Libre Baskerville', serif;
      --font-body: 'Open Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-cream); color: var(--text-dark); font-family: var(--font-body); line-height: 1.6; }

    /* Header */
    header {
      background: var(--primary); color: #fff;
      padding: 24px 40px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 4px solid var(--accent);
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand-icon { font-size: 2.2rem; }
    .brand-text h1 { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; margin-bottom: 2px; }
    .brand-text p { font-size: 0.8rem; color: rgba(255,255,255,0.75); letter-spacing: 0.06em; }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a { color: #fff; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--accent); }

    /* Container */
    .container {
      display: flex; max-width: 1400px; margin: 32px auto;
      gap: 32px; padding: 0 40px;
    }

    /* Sidebar */
    .sidebar { width: 260px; flex-shrink: 0; }
    .filter-group {
      background: var(--bg-white); border: 1px solid var(--border);
      border-radius: 8px; padding: 20px; margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .filter-group h3 {
      font-family: var(--font-heading); font-size: 1rem; margin-bottom: 12px;
      border-bottom: 2px solid var(--bg-cream); padding-bottom: 8px;
    }
    .filter-option {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px; cursor: pointer; font-size: 0.9rem;
    }
    .filter-option input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
    .filter-option label { cursor: pointer; }

    .clear-filters-btn {
      width: 100%;
      padding: 9px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--text-light);
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .clear-filters-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* Catalog */
    .catalog { flex: 1; }

    /* Search */
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-box input {
      flex: 1; padding: 13px 20px; font-size: 1rem; font-family: var(--font-body);
      border: 2px solid var(--border); border-radius: 8px; background: var(--bg-white);
      outline: none; transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-btn {
      background: var(--primary); color: #fff; border: none;
      padding: 0 28px; font-size: 1rem; font-weight: 600; border-radius: 8px;
      cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .search-btn:hover { background: var(--primary-hover); }

    /* Sort + Results header */
    .results-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; color: var(--text-light); font-size: 0.9rem; flex-wrap: wrap; gap: 8px;
    }
    .sort-select {
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
      font-family: var(--font-body); font-size: 0.85rem; background: var(--bg-white);
      color: var(--text-dark); cursor: pointer; outline: none;
    }
    .sort-select:focus { border-color: var(--primary); }

    /* Book Grid */
    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }

    .book-card {
      background: var(--bg-white); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    }
    .book-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.06); border-color: var(--accent); }

    .book-cover {
      height: 200px; background: #eee; border-bottom: 1px solid var(--border);
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      font-size: 3rem; color: var(--text-light);
    }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; }
    .status-tag {
      position: absolute; top: 12px; right: 12px;
      padding: 4px 10px; background: var(--primary); color: #fff;
      font-size: 0.72rem; font-weight: 700; border-radius: 4px;
    }
    .status-tag.borrowed { background: #c0392b; }

    .book-info { padding: 18px; }
    .book-cat {
      display: inline-block;
      background: rgba(27,67,50,0.08);
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .book-title { font-family: var(--font-heading); font-size: 1rem; margin-bottom: 4px; line-height: 1.4; }
    .book-author { color: var(--text-light); font-size: 0.85rem; margin-bottom: 12px; }
    .book-meta { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-light); border-top: 1px solid var(--border); padding-top: 12px; margin-bottom: 12px; }

    .borrow-btn {
      width: 100%;
      padding: 9px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .borrow-btn:hover { background: var(--primary-hover); }
    .borrow-btn.return-btn { background: #e74c3c; }
    .borrow-btn.return-btn:hover { background: #c0392b; }
    .borrow-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 { font-family: var(--font-heading); font-size: 1.2rem; margin-bottom: 8px; }

    /* Back pill */
    .back-btn-pill {
      position: fixed; bottom: 24px; left: 24px; z-index: 150;
      background: var(--primary); border: 2px solid var(--accent); color: #fff;
      padding: 12px 22px; border-radius: 99px; font-weight: 700; font-size: 0.85rem;
      display: flex; align-items: center; gap: 8px; text-decoration: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2); transition: all .2s ease;
    }
    .back-btn-pill:hover { background: var(--primary-hover); transform: translateY(-2px); }

    @media (max-width: 900px) {
      .container { flex-direction: column; padding: 0 20px; }
      .sidebar { width: 100%; }
      .nav-links { display: none; }
      header { padding: 20px; }
    }
    @media (max-width: 500px) {
      .book-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🏛️</div>
      <div class="brand-text">
        <h1>Athenaeum Library</h1>
        <p>ACADEMIC CATALOG SYSTEM · UNITAR UNIVERSITY PROJECT</p>
      </div>
    </div>
    <nav class="nav-links" aria-label="Library navigation">
      <a href="#catalog">Catalog</a>
      <a href="#catalog">Journals</a>
      <a href="#catalog">My Loans</a>
    </nav>
  </header>

  <div class="container" id="catalog">

    <!-- Filters -->
    <aside class="sidebar" aria-label="Catalog filters">
      <div class="filter-group">
        <h3>Subject</h3>
        <label class="filter-option"><input type="checkbox" id="catCS" checked onchange="applyFilters()"> <span>Computer Science</span></label>
        <label class="filter-option"><input type="checkbox" id="catArch" checked onchange="applyFilters()"> <span>Architecture</span></label>
        <label class="filter-option"><input type="checkbox" id="catMed" checked onchange="applyFilters()"> <span>Medicine</span></label>
        <label class="filter-option"><input type="checkbox" id="catBiz" checked onchange="applyFilters()"> <span>Business</span></label>
        <label class="filter-option"><input type="checkbox" id="catLit" checked onchange="applyFilters()"> <span>Literature</span></label>
      </div>

      <div class="filter-group">
        <h3>Availability</h3>
        <label class="filter-option"><input type="checkbox" id="avAvailable" checked onchange="applyFilters()"> <span>Available on Shelf</span></label>
        <label class="filter-option"><input type="checkbox" id="avBorrowed" checked onchange="applyFilters()"> <span>Include Borrowed</span></label>
      </div>

      <button class="clear-filters-btn" onclick="clearFilters()">↺ Reset Filters</button>
    </aside>

    <!-- Catalog Main -->
    <main>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by title, author, or ISBN..." oninput="applyFilters()" aria-label="Search catalog" />
        <button class="search-btn" onclick="applyFilters()">Search</button>
      </div>

      <div class="results-header">
        <div id="resultsCount">Showing all books</div>
        <div>
          Sort by:
          <select class="sort-select" id="sortSelect" onchange="applyFilters()" aria-label="Sort results">
            <option value="relevance">Relevance</option>
            <option value="title">Title A–Z</option>
            <option value="author">Author A–Z</option>
            <option value="year">Year (Newest)</option>
          </select>
        </div>
      </div>

      <div class="book-grid" id="bookGrid"></div>
    </main>
  </div>

  <a href="/" class="back-btn-pill" aria-label="Return to portfolio">
    <span>←</span> Portfolio Home
  </a>

  <script>
    // ===================================================
    // BOOK DATA (20 books, 5 categories)
    // ===================================================
    const BOOKS = [
      // Computer Science
      { id: 1, title: 'Clean Code', author: 'Robert C. Martin', year: 2009, category: 'cs', isbn: '978-0132350884', shelf: 'QA76.73.J38', cover: 'https://images.unsplash.com/photo-1516116216624-53e697fedbea?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 2, title: 'The Pragmatic Programmer', author: 'Andrew Hunt & David Thomas', year: 2019, category: 'cs', isbn: '978-0135957059', shelf: 'QA76.6.H86', cover: 'https://images.unsplash.com/photo-1543286386-713bdd548da4?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 3, title: 'Design Patterns: Elements of Reusable Object-Oriented Software', author: 'Erich Gamma et al.', year: 1994, category: 'cs', isbn: '978-0201633610', shelf: 'QA76.64 .D47', cover: 'https://images.unsplash.com/photo-1583251633146-d0c6eb234b4e?q=80&w=600&auto=format&fit=crop', borrowed: true },
      { id: 4, title: 'Introduction to Algorithms (CLRS)', author: 'Cormen, Leiserson, Rivest, Stein', year: 2022, category: 'cs', isbn: '978-0262046305', shelf: 'QA76.9.A43', cover: 'https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=600&auto=format&fit=crop', borrowed: false },
      // Architecture
      { id: 5, title: 'The Architecture of Light', author: 'Mary Ann Steane', year: 2011, category: 'arch', isbn: '978-0415394789', shelf: 'NA2794 .S74', cover: 'https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 6, title: 'Modern Structural Design', author: 'Andrew Charleson', year: 2005, category: 'arch', isbn: '978-0750669213', shelf: 'TA658 .C43', cover: 'https://images.unsplash.com/photo-1589829085413-56de8ae18c73?q=80&w=600&auto=format&fit=crop', borrowed: true },
      { id: 7, title: 'Towards a New Architecture', author: 'Le Corbusier', year: 1923, category: 'arch', isbn: '978-0486250236', shelf: 'NA680 .L42', cover: 'https://images.unsplash.com/photo-1486325212027-8081e485255e?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 8, title: 'The Timeless Way of Building', author: 'Christopher Alexander', year: 1979, category: 'arch', isbn: '978-0195024029', shelf: 'NA2760 .A46', cover: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=600&auto=format&fit=crop', borrowed: false },
      // Medicine
      { id: 9,  title: "Gray's Anatomy for Students", author: 'Richard Drake et al.', year: 2020, category: 'med', isbn: '978-0323393041', shelf: 'QM23 .D73', cover: 'https://images.unsplash.com/photo-1584820927498-cfe5211fd8bf?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 10, title: 'Harrison\'s Principles of Internal Medicine', author: 'Kasper et al.', year: 2022, category: 'med', isbn: '978-1264268504', shelf: 'RC46 .P88', cover: 'https://images.unsplash.com/photo-1519491050282-cf00c82424b4?q=80&w=600&auto=format&fit=crop', borrowed: true },
      { id: 11, title: 'Robbins Basic Pathology', author: 'Vinay Kumar', year: 2023, category: 'med', isbn: '978-0323790383', shelf: 'RB111 .R63', cover: 'https://images.unsplash.com/photo-1512069772995-ec65ed45afd6?q=80&w=600&auto=format&fit=crop', borrowed: false },
      // Business
      { id: 12, title: 'The Lean Startup', author: 'Eric Ries', year: 2011, category: 'biz', isbn: '978-0307887894', shelf: 'HD62.5 .R54', cover: 'https://images.unsplash.com/photo-1611532736597-de2d4265fba3?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 13, title: 'Good to Great', author: 'Jim Collins', year: 2001, category: 'biz', isbn: '978-0066620992', shelf: 'HD57.7 .C65', cover: 'https://images.unsplash.com/photo-1455894127589-22f75500213a?q=80&w=600&auto=format&fit=crop', borrowed: true },
      { id: 14, title: 'Zero to One', author: 'Peter Thiel & Blake Masters', year: 2014, category: 'biz', isbn: '978-0804139021', shelf: 'HB615 .T54', cover: 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 15, title: 'The Innovator\'s Dilemma', author: 'Clayton M. Christensen', year: 1997, category: 'biz', isbn: '978-1633691780', shelf: 'HD45 .C49', cover: 'https://images.unsplash.com/photo-1568992687947-868a62a9f521?q=80&w=600&auto=format&fit=crop', borrowed: false },
      // Literature
      { id: 16, title: '1984', author: 'George Orwell', year: 1949, category: 'lit', isbn: '978-0451524935', shelf: 'PR6029 .R8', cover: 'https://images.unsplash.com/photo-1476275466078-4007374efbbe?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 17, title: 'Brave New World', author: 'Aldous Huxley', year: 1932, category: 'lit', isbn: '978-0060850524', shelf: 'PR6015 .U9', cover: 'https://images.unsplash.com/photo-1509266272358-7701da638078?q=80&w=600&auto=format&fit=crop', borrowed: true },
      { id: 18, title: 'The Great Gatsby', author: 'F. Scott Fitzgerald', year: 1925, category: 'lit', isbn: '978-0743273565', shelf: 'PS3511.I9', cover: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 19, title: 'To Kill a Mockingbird', author: 'Harper Lee', year: 1960, category: 'lit', isbn: '978-0061935466', shelf: 'PS3523.E426', cover: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=600&auto=format&fit=crop', borrowed: false },
      { id: 20, title: 'Sapiens: A Brief History of Humankind', author: 'Yuval Noah Harari', year: 2011, category: 'lit', isbn: '978-0062316110', shelf: 'GN360 .H37', cover: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=600&auto=format&fit=crop', borrowed: false },
    ];

    const CAT_MAP = { cs: 'Computer Science', arch: 'Architecture', med: 'Medicine', biz: 'Business', lit: 'Literature' };
    const CAT_ICONS = { cs: '💻', arch: '🏛️', med: '⚕️', biz: '📊', lit: '📖' };

    // Track borrow state in memory
    const borrowedState = {};
    BOOKS.forEach(b => { borrowedState[b.id] = b.borrowed; });

    function toggleBorrow(id) {
      borrowedState[id] = !borrowedState[id];
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const cats = {
        cs: document.getElementById('catCS').checked,
        arch: document.getElementById('catArch').checked,
        med: document.getElementById('catMed').checked,
        biz: document.getElementById('catBiz').checked,
        lit: document.getElementById('catLit').checked,
      };
      const showAvailable = document.getElementById('avAvailable').checked;
      const showBorrowed = document.getElementById('avBorrowed').checked;
      const sort = document.getElementById('sortSelect').value;

      let filtered = BOOKS.filter(book => {
        const isBorrowed = borrowedState[book.id];
        // Category filter
        if (!cats[book.category]) return false;
        // Availability filter
        if (isBorrowed && !showBorrowed) return false;
        if (!isBorrowed && !showAvailable) return false;
        // Search
        if (query) {
          const haystack = `${book.title} ${book.author} ${book.isbn}`.toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });

      // Sort
      if (sort === 'title') filtered.sort((a,b) => a.title.localeCompare(b.title));
      else if (sort === 'author') filtered.sort((a,b) => a.author.localeCompare(b.author));
      else if (sort === 'year') filtered.sort((a,b) => b.year - a.year);

      renderBooks(filtered);
    }

    function renderBooks(books) {
      const grid = document.getElementById('bookGrid');
      const count = document.getElementById('resultsCount');

      const total = BOOKS.length;
      count.textContent = `Showing ${books.length} of ${total} books`;

      if (books.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="empty-icon">📭</div>
            <h3>No books found</h3>
            <p>Try adjusting your search or filters.</p>
          </div>`;
        return;
      }

      grid.innerHTML = books.map(book => {
        const isBorrowed = borrowedState[book.id];
        const statusLabel = isBorrowed ? 'Borrowed' : 'Available';
        const statusClass = isBorrowed ? 'borrowed' : '';
        const btnLabel = isBorrowed ? '↩ Return Book' : '📚 Borrow';
        const btnClass = isBorrowed ? 'borrow-btn return-btn' : 'borrow-btn';

        return `
          <article class="book-card">
            <div class="book-cover">
              <span class="status-tag ${statusClass}">${statusLabel}</span>
              <img src="${book.cover}" alt="${book.title}" loading="lazy" />
            </div>
            <div class="book-info">
              <div class="book-cat">${CAT_ICONS[book.category]} ${CAT_MAP[book.category]}</div>
              <h2 class="book-title">${book.title}</h2>
              <p class="book-author">By ${book.author} · ${book.year}</p>
              <div class="book-meta">
                <span>ISBN: ${book.isbn.slice(0,13)}</span>
                <span>${book.shelf}</span>
              </div>
              <button class="${btnClass}" onclick="toggleBorrow(${book.id})" aria-label="${btnLabel} - ${book.title}">
                ${btnLabel}
              </button>
            </div>
          </article>`;
      }).join('');
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      ['catCS','catArch','catMed','catBiz','catLit','avAvailable','avBorrowed'].forEach(id => {
        document.getElementById(id).checked = true;
      });
      document.getElementById('sortSelect').value = 'relevance';
      applyFilters();
    }

    // Initialize
    applyFilters();
  </script>
</body>
</html>
